name: Prod Build, Analyze and Deploy Flashcards App

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write
  id-token: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16@sha256:42b8b8b29c8a4e933d88943e5b03001a78794905cf786e6e7634e9f2abd5a0d3
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: flashcardsdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      JAVA_VERSION: "17"
      SONAR_JAVA_VERSION: "21"

      IMAGE_NAME: flashcards
      RELEASE_TAG: ${{ github.ref_name }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate formatting with Spotless
        run: ./mvnw -B spotless:check

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: java

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run Tests + JaCoCo
        run: |
          chmod +x ci-scripts/test.sh
          ./ci-scripts/test.sh coverage-main
  
      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml

      - name: Set up JDK ${{ env.SONAR_JAVA_VERSION }} for Sonar
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ env.SONAR_JAVA_VERSION }}

      - name: SonarCloud analysis
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: val7304
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
            chmod +x ci-scripts/sonar.sh
            ./ci-scripts/sonar.sh

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9    #v5.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Compute short SHA
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          chmod +x ci-scripts/docker-build.sh
          ./ci-scripts/docker-build.sh "$IMAGE_NAME" "$IMAGE_TAG"

      - name: Show Docker images
        run: docker image ls

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.72.0"
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          exit-code: "1"
          
      - name: Run container for smoke tests
        run: |
          docker run --pull=never -d --name flashcards-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/flashcardsdb \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            $IMAGE_NAME:$IMAGE_TAG

      - name: Wait for Spring Boot health endpoint
        run: |
          for i in {1..20}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Spring Boot is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs flashcards-smoke
          exit 1

      - name: Smoke Test - Categories endpoint
        run: |
          for i in {1..3}; do
            if curl -sf http://localhost:8080/api/categories > /dev/null; then
              echo "API /categories OK"
              exit 0
            fi
            sleep 5
          done
          echo "API smoke test FAILED"
          exit 1

      - name: Stop smoke test container
        if: always()
        run: |
          docker stop flashcards-smoke || true
          docker rm flashcards-smoke || true

      - name: Log in to Docker Hub
        if: env.IS_RELEASE == 'true'
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image to Docker Hub
        if: env.IS_RELEASE == 'true'
        run: |
          docker tag $IMAGE_NAME:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${RELEASE_TAG}
          docker tag $IMAGE_NAME:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:${RELEASE_TAG}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME:latest
          