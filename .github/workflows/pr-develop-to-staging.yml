name: Auto PR - Develop to Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  create-pr:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create PR if needed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e

          AHEAD=$(gh api \
            repos/${{ github.repository }}/compare/staging...develop \
            --jq '.ahead_by')
            
          if [ "$AHEAD" -eq 0 ]; then
            echo "No differences between develop and staging"
            exit 0
          fi

          PR_NUMBER=$(gh pr list \
            --base staging \
            --head develop \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base staging \
              --head develop \
              --title "Promote develop → staging" \
              --body "Automatic promotion after successful CI." \
              --label "automated" \
              --label "promote"
            
            PR_NUMBER=$(gh pr list \
              --base staging \
              --head develop \
              --json number \
              --jq '.[0].number')
          else
            echo "PR already exists: #$PR_NUMBER"
          fi
          echo "PR number: $PR_NUMBER"

          MAX_ATTEMPTS=4
          
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            echo "Enabling auto-merge (attempt $ATTEMPT/$MAX_ATTEMPTS)..."

            if gh pr merge "$PR_NUMBER" --auto --merge; then
              echo "Auto-merge enabled successfully for PR #$PR_NUMBER"
              exit 0
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              DELAY=$((5 * ATTEMPT))
              echo "Merge request failed. Retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
          done

          echo "::error::Unable to enable auto-merge for PR #$PR_NUMBER"
          exit 1
