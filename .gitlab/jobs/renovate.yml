renovate:
  stage: quality
  image: $RENOVATE_IMAGE
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "https://gitlab.com/api/v4"
    RENOVATE_REPOSITORIES: "val7304/flashcards"
    RENOVATE_TOKEN: "$RENOVATE_TOKEN"
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never
